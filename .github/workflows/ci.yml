name: UI validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Validate image prompt library
        run: npm run prompts:validate
      - name: Smoke test generated prompt output
        run: |
          npm run prompts -- generate --category animals --output ./output/prompts
          test -f output/prompts/animals/forest-friends--easy.txt
          test -f output/prompts/animals/farm-animals--easy.txt
          test -f output/prompts/manifest.json
      - name: Typecheck and production build
        run: npm run build
      - name: Verify prerendered SEO pages
        run: |
          test -f out/index.html
          test -f out/puzzles/index.html
          test -f out/play/sunny-valley/index.html
          test -f out/play/forest-friends/index.html
          test -f out/play/moon-adventure/index.html
          test -f out/robots.txt
          grep -q 'Forest Friends' out/play/forest-friends/index.html
