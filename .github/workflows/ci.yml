name: UI validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Sync artwork and verify manifest
        run: |
          npm run assets:sync
          git diff --exit-code -- src/content/generated/puzzle-manifest.ts
      - name: Unit tests
        run: npm test
      - name: Validate image prompt library
        run: npm run prompts:validate
      - name: Smoke test generated prompt output
        run: |
          npm run prompts -- generate --category animals --output ./output/prompts
          test -f output/prompts/animals/forest-friends--easy.txt
          test -f output/prompts/animals/farm-animals--easy.txt
          test -f output/prompts/manifest.json
      - name: Typecheck and production build
        run: npm run build
      - name: Verify prerendered SEO pages
        run: |
          test -f out/index.html
          test -f out/puzzles/index.html
          for category in animals nature space vehicles; do test -f "out/puzzles/$category/index.html"; done
          grep -q 'Little pieces' out/index.html
          grep -q 'Animal friends' out/puzzles/animals/index.html
          test -f out/play/sunny-valley/index.html
          test -f out/play/forest-friends/index.html
          test -f out/play/moon-adventure/index.html
          test -f out/play/animals-arctic-fox-snow/index.html
          test -f out/assets/puzzle-images/animals/arctic-fox-snow--medium.avif
          test -f out/robots.txt
          grep -q 'Forest Friends' out/play/forest-friends/index.html
